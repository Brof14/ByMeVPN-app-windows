name: Release Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Release version (e.g. v1.2.22)'
        required: false
        default: 'v1.2.22'
      create_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows .exe installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup and verify tunnel runtime (Xray & Wintun)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/setup-runtime.ps1

      - name: Run Unit Tests
        shell: powershell
        run: |
          $env:BYMEVPN_NO_ADMIN_MANIFEST = "1"
          cargo test --release --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri NSIS installer
        shell: powershell
        run: |
          npx --yes @tauri-apps/cli@2 build

      - name: Install, verify runtime hashes and uninstall NSIS package
        shell: pwsh
        run: ./scripts/smoke-nsis.ps1

      - name: Package .exe installer & Calculate Checksum
        id: artifacts
        shell: powershell
        run: |
          ./scripts/package-installers.ps1

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: ByMeVPN-Windows-Build
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          name: ByMeVPN Windows ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          body: |
            ## ByMeVPN для Windows

            ### Файлы установки
            * **`ByMeVPN_*_x64-setup.exe`** — установщик Windows (NSIS). Внутри проверенные Xray, Wintun и базы маршрутизации.
            * **`SHA256SUMS.txt`** — контрольная сумма установщика.

            ### Что изменилось
            * «Российские сайты напрямую»: приложение определяет имя сайта, а адреса для российских сайтов берёт у российского DNS-сервера — напрямую, не через заграничный сервер. Поэтому российские сайты открываются, а не уходят в туннель.
            * Подключение быстрее: проверка маршрута до сервера идёт одновременно с проверкой самого сервера, а не перед ней.
            * Загрузка страниц быстрее: приложение больше не ждёт IPv6-ответы там, где они не нужны, и открывает соединение с сервером сразу с первым пакетом.
            * Ошибки подключения описаны простыми словами — без кодов, путей к журналам и названий служебных процессов.

            ### Контрольные суммы (SHA-256)
            См. прикреплённый файл `SHA256SUMS.txt`.
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
