name: Release Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Release version (e.g. v1.2.20)'
        required: false
        default: 'v1.2.20'
      create_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows .exe installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup and verify tunnel runtime (Xray & Wintun)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/setup-runtime.ps1

      - name: Run Unit Tests
        shell: powershell
        run: |
          $env:BYMEVPN_NO_ADMIN_MANIFEST = "1"
          cargo test --release --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri NSIS installer
        shell: powershell
        run: |
          npx --yes @tauri-apps/cli@2 build

      - name: Install, verify runtime hashes and uninstall NSIS package
        shell: pwsh
        run: ./scripts/smoke-nsis.ps1

      - name: Package .exe installer & Calculate Checksum
        id: artifacts
        shell: powershell
        run: |
          ./scripts/package-installers.ps1

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: ByMeVPN-Windows-Build
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          name: ByMeVPN Windows ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          body: |
            ## ByMeVPN Windows Client Release
            
            ### Файлы установки:
            * **`ByMeVPN_*_x64-setup.exe`** — единственный установщик Windows. Содержит проверенные Xray, Wintun и базы маршрутизации.
            * **`SHA256SUMS.txt`** — контрольная сумма установщика.
            
            ### Основные возможности:
            * Экспериментальный клиент Xray/Wintun: запуск и проверка конфигурации реализованы, реальные сетевые сценарии требуют проверки.
            * Вход через email и Telegram; Google OAuth доступен при настройке серверной интеграции.
            * Закрытие окна скрывает клиент в системный трей; фоновое соединение и автопереподключение работают, пока приложение запущено.
            * Автоматическое восстановление соединения после подтверждённого обрыва с увеличением интервалов повторных попыток.
            * Сбой IP-check сайтов переключает проверку на точные HTTPS-ответы. Трафик может остаться подключённым, но защита не будет подтверждена без проверки IP и маршрута TUN.
            * Проверки выхода VPN ограничены по параллельности; подтверждённый HTTPS-трафик не ждёт недоступные IP-сервисы.
            * Выход из аккаунта, отключение, восстановление при запуске и штатный выход используют общую очистку маршрутов и DNS только адаптера ByMeVPN.
            * При сбое каталога сохраняется очищенный список локаций для показа; для подключения всё ещё требуется актуальная API-сессия.
            * Один пропуск проверки здоровья не останавливает туннель; доказанный обход маршрута остаётся причиной немедленно закрыть соединение.
            * Отдельная Windows-служба, Kill Switch, IPv6/DNS leak protection и проверка безошибочного восстановления маршрутов не прошли Windows acceptance.
            * Не использовать как подтверждённое средство защиты до прохождения полного набора сетевых тестов.
            
            ### Контрольные суммы (SHA-256):
            См. прикреплённый файл `SHA256SUMS.txt`.
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          # Remains gated until privileged-service, signed-build and live-network release criteria pass.
          draft: true
          prerelease: true
