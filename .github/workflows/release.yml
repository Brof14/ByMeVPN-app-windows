name: Release Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Release version (e.g. v1.2.0)'
        required: false
        default: 'v1.2.0'
      create_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installers (.exe & .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup and verify tunnel runtime (Xray & Wintun)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/setup-runtime.ps1

      - name: Run Unit Tests
        shell: powershell
        run: |
          $env:BYMEVPN_NO_ADMIN_MANIFEST = "1"
          cargo test --release --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Installers (.exe and .msi)
        shell: powershell
        run: |
          npx --yes @tauri-apps/cli build

      - name: Prepare Artifacts & Calculate Checksums
        id: artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          
          # Copy installers
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" "dist/" -Force -ErrorAction SilentlyContinue
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" "dist/" -Force -ErrorAction SilentlyContinue
          Copy-Item "src-tauri/target/release/bymevpn.exe" "dist/bymevpn-standalone.exe" -Force -ErrorAction SilentlyContinue
          
          # Compute SHA-256 hashes
          cd dist
          Get-FileHash -Algorithm SHA256 * | ForEach-Object {
            "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)"
          } | Out-File -Encoding utf8 "SHA256SUMS.txt"
          cd ..
          
          Get-ChildItem -Path dist | Format-Table Name, Length

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: ByMeVPN-Windows-Build
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: ByMeVPN Windows ${{ github.ref_name || github.event.inputs.tag_name }}
          body: |
            ## ByMeVPN Windows Client Release
            
            ### Файлы установки:
            * **`ByMeVPN_1.2.0_x64-setup.exe`** — Рекомендуемый инсталлятор Windows (NSIS). Полная поддержка UAC, интеграция в систему, автоматическое удаление и обновление.
            * **`ByMeVPN_1.2.0_x64_en-US.msi`** — MSI-пакет для корпоративного развёртывания (GPO / Active Directory / Intune).
            * **`bymevpn-standalone.exe`** — Портативный бинарник.
            
            ### Основные возможности:
            * VPN-туннель **Xray-core + Wintun** (VLESS + Reality, MTU 1500, полный захват трафика без WinINET HTTP-прокси).
            * Авторизация через Telegram (@ByMeVPNbot), Google OAuth и Email.
            * Умный обход российских сайтов (`.ru`, `.рф`, `gosuslugi.ru`, `geoip:ru` идут напрямую).
            * Kill Switch & аварийная защита сети при сбое.
            * 8 экранов Pixel-Perfect интерфейса, оптимизированных для работы на слабых и старых ПК (0% CPU в простое, аппаратное ускорение анимаций).
            
            ### Контрольные суммы (SHA-256):
            См. прикреплённый файл `SHA256SUMS.txt`.
          files: |
            dist/*.exe
            dist/*.msi
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
