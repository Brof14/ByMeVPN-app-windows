name: Release Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Release version (e.g. v1.2.0)'
        required: false
        default: 'v1.2.0'
      create_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installers (.exe & .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup and verify tunnel runtime (Xray & Wintun)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/setup-runtime.ps1

      - name: Run Unit Tests
        shell: powershell
        run: |
          $env:BYMEVPN_NO_ADMIN_MANIFEST = "1"
          cargo test --release --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Installers (.exe and .msi)
        shell: powershell
        run: |
          npx --yes @tauri-apps/cli build

      - name: Prepare Artifacts & Calculate Checksums
        id: artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          
          # Copy installers and standalone binary using robust PowerShell discovery
          Get-ChildItem -Path "src-tauri\target\release\bundle" -Include *.exe, *.msi -Recurse | Copy-Item -Destination "dist" -Force
          if (Test-Path "src-tauri\target\release\bymevpn.exe") {
            Copy-Item "src-tauri\target\release\bymevpn.exe" "dist\bymevpn-standalone.exe" -Force
          }
          
          # Compute SHA-256 hashes
          Get-ChildItem -Path "dist" -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Path "dist\SHA256SUMS.txt" -Encoding utf8
          
          Get-ChildItem -Path "dist" | Format-Table Name, Length

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: ByMeVPN-Windows-Build
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: ByMeVPN Windows ${{ github.ref_name || github.event.inputs.tag_name }}
          body: |
            ## ByMeVPN Windows Client Release
            
            ### Файлы установки:
            * **`ByMeVPN_1.2.0_x64-setup.exe`** — Рекомендуемый инсталлятор Windows (NSIS). Полная поддержка UAC, интеграция в систему, автоматическое удаление и обновление.
            * **`ByMeVPN_1.2.0_x64_en-US.msi`** — MSI-пакет для корпоративного развёртывания (GPO / Active Directory / Intune).
            * **`bymevpn-standalone.exe`** — Портативный бинарник.
            
            ### Основные возможности:
            * Экспериментальный клиент Xray/Wintun: запуск и проверка конфигурации реализованы, реальные сетевые сценарии требуют проверки.
            * Вход через email и Telegram, Google OAuth временно отключён.
            * Kill Switch, фоновый сервис, IPv6/DNS leak protection и проверка безошибочного восстановления маршрутов не прошли Windows acceptance.
            * Не использовать как подтверждённое средство защиты до прохождения полного набора сетевых тестов.
            
            ### Контрольные суммы (SHA-256):
            См. прикреплённый файл `SHA256SUMS.txt`.
          files: |
            dist/*
          # Not publicly marked stable until real Windows VPN acceptance is signed off.
          draft: true
          prerelease: true
