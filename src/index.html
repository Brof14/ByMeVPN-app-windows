<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <div class="power-circle">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <circle cx="50" cy="50" r="46"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-dasharray="245 44"
                  stroke-dashoffset="122.5"
                  transform="rotate(-90 50 50)"
                  stroke-linecap="round"
                  opacity="0.4"/>

          <path d="M 32.32 32.32 A 25 25 0 1 0 67.68 32.32"
                fill="none"
                stroke="currentColor"
                stroke-width="4"
                stroke-linecap="round"/>

          <line x1="50" y1="16" x2="50" y2="46"
                stroke="currentColor"
                stroke-width="4"
                stroke-linecap="round"/>
        </svg>
      </div>
      <div class="config-wrapper">
        <div class="config-card">
          <!-- Твое исходное состояние -->
          <div id="state-empty">
            <div class="config-text">
              <h3 class="config-title">Конфига пока нет</h3>
              <p class="config-desc">Получите его, чтобы можно было подключиться</p>
            </div>
            <button class="get-config-btn" id="add_config_button">
              ↓ Получить конфиг
            </button>
          </div>

          <!-- Состояние после нажатия (по умолчанию скрыто) -->
          <div id="state-loaded" class="config-loaded hidden">
            <div class="config-loaded-info">
              <span class="config-loaded-label">КОНФИГ</span>
              <span class="config-loaded-status">Готов к работе</span>
            </div>
            <div class="config-status-dot"></div>
          </div>
        </div>
      </div>
      <button class="btn-power" id='enable_button'>
        <svg class="power-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
          <line x1="12" y1="2" x2="12" y2="12"></line>
        </svg>
        <span id="enable_text" >Включить</span>
      </button>
    </main>
  </body>
</html>
